name: Update question metadata

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/generate-question-metadata.mjs'

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metadata
        run: node scripts/generate-question-metadata.mjs

      - name: Commit metadata if changed
        run: |
          if git diff --quiet -- data/question-metadata.json data/question-search-index.json; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/question-metadata.json data/question-search-index.json
          git commit -m "chore: update question metadata"
          git push
