name: Maintain Book Index

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '!data/books.json'
  workflow_dispatch:

# يمنع سباق عمليتين من إعادة كتابة books.json فوق بعضهما.
concurrency:
  group: content-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair missing question identities and update chapter counts
        run: python3 update_questions.py

      - name: Generate non-destructive data integrity report
        run: python3 integrity_check.py

      - name: Commit safe maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/*/chapter_*.json reports/data_integrity_report.json
          if git diff --cached --quiet; then
            echo "لا توجد صيانة تلقائية مطلوبة."
            exit 0
          fi
          git commit -m "صيانة تلقائية آمنة لفهرس الكتب ومعرفات الأسئلة"
          git pull --rebase origin main
          git push origin HEAD:main
