name: Maintain Legal Data Indexes

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/generate-question-metadata.mjs'
      - 'scripts/build-search-index.js'
      - 'update_questions.py'
      - 'integrity_check.py'
      - '.github/workflows/auto-update-books.yml'
  workflow_dispatch:

# One serialized pipeline keeps chapter counts, question metadata and search index in sync.
concurrency:
  group: content-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair question identities and update chapter counts
        run: python3 update_questions.py

      - name: Generate non-destructive data integrity report
        run: python3 integrity_check.py

      - name: Generate question metadata
        run: node scripts/generate-question-metadata.mjs

      - name: Build search index
        run: node scripts/build-search-index.js

      - name: Commit safe maintenance changes
        id: maintenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/*/chapter_*.json data/question-metadata.json data/search-index.json reports/data_integrity_report.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: maintain legal data indexes and integrity report"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated public data
        if: steps.maintenance.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
