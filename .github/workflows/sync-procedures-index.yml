name: Sync Published Procedure Titles

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-procedures-index]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-procedures-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Firestore REST client dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Query published procedure titles
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'iraq-law-test' }}
        run: python scripts/sync-procedures-index.py

      - name: Commit updated public title index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add procedures-index.json
          if git diff --cached --quiet; then
            echo "The public procedure index is already current."
            exit 0
          fi
          git commit -m "chore: sync published procedure title index"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish website with updated index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
