name: AI Spelling Check

on:
  schedule:
    # يعمل مرة واحدة يومياً كل 24 ساعة (الساعة 12 منتصف الليل بتوقيت UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai --break-system-packages

      - name: Run AI spellcheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 spellcheck_ai.py --repo-root .

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]"
          git add reports/spelling_report.json reports/scan_state.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغييرات جديدة لرفعتها"
          else
            git commit -m "تحديث تقرير الفحص الإملائي للفصل الحالي"
            git fetch origin main
            git merge origin/main --no-edit -X ours
            git push
          fi
