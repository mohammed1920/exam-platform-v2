name: AI Spelling Check

on:
  schedule:
    # الفحص الدوري اليومي الساعة 12 ظهراً بتوقيت بغداد (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI spellcheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 spellcheck_ai.py --repo-root .

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]"
          git add reports/spelling_report.json reports/scan_state.json
          if git diff --cached --quiet; then
            echo "لا يوجد أخطاء جديدة للحفظ"
          else
            git commit -m "تحديث تقرير الفحص الإملائي وحالة الفحص"
            git fetch origin main
            git merge origin/main --no-edit -X ours
            git push
          fi
