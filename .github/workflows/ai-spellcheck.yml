name: AI Spelling Check

on:
  push:
    paths:
      - 'spellcheck_ai.py'
      - 'requirements.txt'
      - '.github/workflows/ai-spellcheck.yml'
  schedule:
    # الفحص الدوري اليومي الساعة 12 ظهراً بتوقيت بغداد (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  # تشترك مهام صيانة المحتوى في مجموعة واحدة لمنع تداخل حفظ التقارير.
  group: content-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI spellcheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          set -euo pipefail
          python3 spellcheck_ai.py --repo-root .

      - name: Commit and push report
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/spelling_report.json reports/scan_state.json
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة في تقرير التدقيق أو حالة الفحص."
            exit 0
          fi
          # ثبّت التغييرات أولاً ليصبح working tree نظيفاً قبل إعادة الدمج.
          git commit -m "تحديث تقرير الفحص الإملائي وحالة الفحص"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
