name: Mizan Static Preview

on:
  push:
    branches:
      - "refactor/architecture-foundation"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mizan-static-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Prepare static preview
        run: |
          touch .nojekyll
          printf '%s\n' 'This is a static preview of the Mizan refactor branch. API-dependent features require the Vercel environment.' > PREVIEW-INFO.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
