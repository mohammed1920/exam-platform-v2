name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair missing question identities before deployment
        run: python3 update_questions.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate project before deployment
        run: |
          node scripts/validate-static-project.mjs
          python3 validate_project.py

      - name: Build public site only
        run: |
          rm -rf dist
          mkdir -p dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name 'manifest.json' \) -exec cp {} dist/ \;
          cp -r engine icons data assets dist/
          # تُنسخ ملفات التشغيل الفعلية فقط؛ تبقى التقارير وملفات Python والوثائق وإعدادات CI خارج النشر.
          test -f dist/contact-info.js
          test -f dist/exam-drafts.js
          test -f dist/question-sharing.js
          test -f dist/mizan-colors.css
          test -f dist/mizan-design-tokens.css
          test -f dist/assets/branding/meezan-assemble.json
          test -f dist/engine/examEngine.js
          test -f dist/data/search-index.json
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
