name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair missing question identities before deployment
        run: python3 update_questions.py

      - name: Validate project before deployment
        run: python3 validate_project.py

      - name: Build public site only
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app.js style.css manifest.json service-worker.js dist/
          cp -r engine icons data dist/
          # لا ننشر لوحة الأدمن، التقارير، ملفات Python، الوثائق، أو إعدادات CI.
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
