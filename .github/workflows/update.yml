name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair missing question identities before deployment
        run: python3 update_questions.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax before deployment
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \\( -name '*.js' -o -name '*.mjs' \\) \\
            -not -path './.git/*' \\
            -not -path './node_modules/*' \\
            -not -path './dist/*' \\
            -print0 | xargs -0 -r -n1 node --check

      - name: Validate project before deployment
        run: |
          node scripts/validate-static-project.mjs
          python3 validate_project.py

      - name: Build public site only
        run: |
          bash scripts/build-pages-bundle.sh dist
          node scripts/build-petition-index.mjs dist/data/petitions

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
