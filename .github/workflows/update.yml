name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make app icon backgrounds transparent
        if: ${{ !contains(github.event.head_commit.message, 'chore: finalize transparent app icons') }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          paths = [Path('icons/icon-192.png'), Path('icons/icon-512.png'), Path('icons/apple-touch-icon.png')]
          def dist(a, b):
              return sum((a[i] - b[i]) ** 2 for i in range(3)) ** 0.5

          for path in paths:
              if not path.exists(): continue
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              px = im.load()
              samples = [px[0,0][:3], px[w-1,0][:3], px[0,h-1][:3], px[w-1,h-1][:3]]
              bg = tuple(sum(s[i] for s in samples)//4 for i in range(3))
              q = deque(); seen = bytearray(w*h)
              def add(x,y):
                  if x < 0 or y < 0 or x >= w or y >= h: return
                  idx=y*w+x
                  if seen[idx]: return
                  if dist(px[x,y][:3], bg) <= 28:
                      seen[idx]=1; q.append((x,y))
              for x in range(w): add(x,0); add(x,h-1)
              for y in range(h): add(0,y); add(w-1,y)
              while q:
                  x,y=q.popleft(); r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
                  add(x+1,y); add(x-1,y); add(x,y+1); add(x,y-1)
              im.save(path,'PNG',optimize=True)
              print('Processed',path)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize transparent app icons'
          git push

      - name: Repair missing question identities before deployment
        run: python3 update_questions.py

      - name: Validate project before deployment
        run: python3 validate_project.py

      - name: Build public site only
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app.js firebase-auth.js style.css manifest.json service-worker.js dist/
          cp admin.html dist/
          cp -r engine icons data dist/
          # ننشر لوحة الأدمن القديمة كما كانت سابقاً؛ لا ننشر التقارير أو ملفات Python أو الوثائق أو إعدادات CI.
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
