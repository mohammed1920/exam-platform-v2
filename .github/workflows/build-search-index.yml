name: Build search index

on:
  push:
    branches:
      - main
    paths:
      - "data/**/chapter_*.json"
      - "data/books.json"
      - "scripts/build-search-index.js"
      - ".github/workflows/build-search-index.yml"

permissions:
  contents: write

# Serialize repository writes with book maintenance and question metadata updates.
concurrency:
  group: content-maintenance
  cancel-in-progress: false

jobs:
  build-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build search index
        run: node scripts/build-search-index.js

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json
          if git diff --cached --quiet; then
            echo "Search index is already up to date."
            exit 0
          fi
          git commit -m "Auto-update search index"
          git pull --rebase origin main
          git push origin HEAD:main
