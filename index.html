<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الاختبارات القانونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="logo-container">
      <span class="app-title">منصة الاختبارات القانونية</span>
      <i class="fas fa-balance-scale logo-icon"></i>
    </div>
    <p class="app-subtitle">المكتبة الرقمية للتشريعات العراقية</p>
  </header>

  <main id="books-section" class="view-section active">
    <div class="search-container">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="search-input" placeholder="ابحث عن كتاب قانوني...">
      </div>
    </div>
    <div id="books-container" class="grid-container">
      </div>
  </main>

  <main id="chapters-section" class="view-section">
    <div class="container-box">
      <div class="nav-header">
        <button id="back-books-btn" class="back-btn"><i class="fas fa-arrow-right"></i> عودة للكتب</button>
      </div>
      <div id="chapters-header" class="section-title"></div>
      <div id="chapters-container" class="chapters-list">
        </div>
    </div>
  </main>

  <main id="exam-section" class="view-section">
    <div class="exam-container">
      <div class="exam-header-bar">
        <span id="exam-book-chapter">اسم الكتاب - الفصل</span>
        <div class="exam-timer-box">
          <i class="fas fa-clock"></i> <span id="exam-timer">00:00</span>
        </div>
      </div>
      
      <div class="progress-container">
        <div id="progress-fill" class="progress-bar"></div>
      </div>

      <div id="question-container">
        </div>

      <div class="exam-actions">
        <button id="prev-btn" class="exam-btn prev">السؤال السابق</button>
        <button id="next-btn" class="exam-btn next">السؤال التالي</button>
      </div>
      <div style="text-align: center; margin-top: 15px;">
        <button id="back-to-books" class="exit-exam-btn">إلغاء الاختبار والعودة</button>
      </div>
    </div>
  </main>

  <main id="results-section" class="view-section">
    <div class="result-card">
      <div class="result-icon">🏁</div>
      <h2>اكتمل الاختبار بنجاح</h2>
      <div id="result-grade" class="result-grade">ممتاز! 🎉</div>
      <div id="result-score" class="result-score">النتيجة: 0 / 0</div>
      <div id="result-percent" class="result-percent">0%</div>
      <div class="result-meta">
        <span>⏱ الوقت المستغرق: <strong id="result-time">0 ثانية</strong></span>
      </div>
      <div class="result-buttons">
        <button id="restart-exam-btn" class="res-btn restart"><i class="fas fa-redo"></i> إعادة الاختبار</button>
        <button id="review-exam-btn" class="res-btn review"><i class="fas fa-search-plus"></i> مراجعة الأخطاء</button>
      </div>
    </div>
  </main>

  <main id="review-section" class="view-section">
    <div class="container-box">
      <div class="nav-header">
        <button id="back-from-review" class="back-btn"><i class="fas fa-arrow-right"></i> عودة</button>
      </div>
      <h2 class="section-title">مراجعة الإجابات غير الصحيحة</h2>
      <div id="review-content" class="review-list">
        </div>
    </div>
  </main>

  <footer class="main-footer">
    <p>© 2026 جميع الحقوق محفوظة لـ منصة الاختبارات القانونية</p>
    <div id="footerContactDetails" class="footer-contact"></div>
    <div id="footerSocialButtons" class="footer-social"></div>
  </footer>

  <script src="data/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
