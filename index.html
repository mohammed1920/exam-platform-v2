<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الاختبارات القانونية V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=1.3">
  <style>
    .option-btn {
      transition: all 0.3s ease;
      border: 2px solid #334155;
    }
    .option-btn:hover:not(.disabled) {
      border-color: #c29d5f;
      transform: translateY(-2px);
    }
    .option-btn.correct {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
      color: white;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .option-btn.incorrect {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border-color: #ef4444;
      color: white;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <h1>منصة الاختبارات القانونية V2</h1>
    <p>أداة ذكية لاختبار وتطوير معلوماتك القانونية بأسلوب حديث</p>
  </header>

  <main class="container">
    <section id="books-section" class="view-section active">
      <div class="search-container">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" placeholder="ابحث عن كتاب قانوني...">
        </div>
      </div>
      <div class="books-grid" id="books-container">
        </div>
    </section>

    <section id="chapters-section" class="view-section">
      <button class="back-btn" id="back-to-books"><i class="fas fa-arrow-right"></i> العودة للكتب</button>
      <div id="chapters-header" style="margin-bottom: 25px;"></div>
      <div class="chapters-list" id="chapters-container">
        </div>
    </section>

    <section id="exam-section" class="view-section">
      <div class="exam-box">
        <div class="exam-header">
          <div class="exam-title" id="exam-book-chapter">اسم الكتاب - الفصل</div>
          <div class="exam-timer" id="exam-timer">00:00</div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="question-container" id="question-container">
          </div>
        <div class="exam-footer">
          <button class="exam-btn prev" id="prev-btn">السؤال السابق</button>
          <button class="exam-btn next" id="next-btn">التالي</button>
        </div>
      </div>
    </section>

    <section id="results-section" class="view-section">
      <div class="results-box">
        <div class="result-emoji" id="result-emoji">🏆</div>
        <div class="result-grade" id="result-grade">ممتاز</div>
        <div class="result-score" id="result-score">النتيجة: 0 / 0</div>
        <div class="result-details">
          <div class="detail-item">
            <span class="detail-label">نسبة النجاح:</span>
            <span class="detail-value" id="result-percent">0%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">الوقت المستغرق:</span>
            <span class="detail-value" id="result-time">0 ثانية</span>
          </div>
        </div>
        <div class="results-actions">
          <button class="start-exam-btn" id="restart-exam-btn" style="background: var(--primary); color: var(--bg-dark);">إعادة الاختبار</button>
          <button class="back-btn" id="back-books-btn" style="margin-bottom:0;">الرئيسية</button>
        </div>
        <button class="back-btn" id="review-exam-btn" style="margin-top:15px; width:100%;">📄 مراجعة الأخطاء</button>
      </div>
    </section>

    <section id="review-section" class="view-section">
      <button class="back-btn" id="back-from-review"><i class="fas fa-arrow-right"></i> العودة للرئيسية</button>
      <h2 style="margin-bottom: 20px;">📄 مراجعة الإجابات الخاطئة</h2>
      <div id="review-content">
        </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-links" id="footerSocialButtons">
        </div>
      <div class="footer-bottom">
        <p class="footer-contact-info" id="footerContactDetails">
          </p>
        <p>© 2026 منصة الاختبارات القانونية V2. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </footer>

  <script src="engine/examEngine.js"></script>
  <script src="app.js?v=1.3"></script>
</body>
</html>
