<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات القانونية V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.3">
    <style>
        /* تأثيرات الخيارات */
        .option-btn {
            transition: all 0.3s ease;
            border: 2px solid #334155;
        }
        .option-btn:hover:not(.disabled) {
            border-color: #c29d5f;
            transform: translateY(-2px);
        }
        .option-btn.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: #10b981;
            color: white;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        .option-btn.incorrect,
        .option-btn.wrong {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: #ef4444;
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .option-btn.correct::after {
            content: ' ✓';
            font-weight: bold;
        }
        .option-btn.incorrect::after {
            content: ' ✗';
            font-weight: bold;
        }
        /* واجهة المراجعة */
        .review-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #c29d5f;
        }
        .review-question {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .review-answer {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .review-answer.correct {
            background: #064e3b;
            color: #10b981;
            border-left: 4px solid #10b981;
        }
        .review-answer.incorrect {
            background: #7f1d1d;
            color: #fca5a5;
            border-left: 4px solid #ef4444;
        }
        .review-explanation {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            color: #cbd5e1;
            font-size: 0.95rem;
            border-right: 3px solid #c29d5f;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1><i class="fas fa-balance-scale"></i> منصة الاختبارات القانونية</h1>
        <p>النسخة الثانية - منصة اختبارات حديثة وسهلة الاستخدام</p>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Books Section -->
        <section id="books-section">
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن كتاب..." onkeyup="app.filterBooks()">
                <div class="search-suggestions" id="searchSuggestions" style="display: none;"></div>
            </div>
            <div id="books-container" class="books-grid"></div>
            <div id="no-results" class="no-results" style="display: none; text-align: center; color: #94a3b8; margin-top: 40px; font-size: 1.1rem;">
                😕 لم نجد كتاباً يطابق بحثك. حاول بكلمات أخرى.
            </div>
        </section>

        <!-- Chapters Section -->
        <section id="chapters-container" class="chapters-container">
            <div class="chapters-header">
                <button id="back-btn" class="back-btn">← العودة للكتب</button>
                <div>
                    <h2 id="chapters-title"></h2>
                    <p id="chapters-author" style="color: #94a3b8; margin-top: 5px;"></p>
                </div>
            </div>
            <div id="chapters-grid" class="chapters-grid"></div>
        </section>

        <!-- Exam Section -->
        <section id="exam-container" class="exam-container">
            <!-- Exam Header - Compact Stats Bar -->
            <div class="exam-stats-bar">
                <div class="stat-item">
                    <span class="stat-label">الوقت</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">التقدم</span>
                    <span class="stat-value" id="progress-text">1/0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">صحيح</span>
                    <span class="stat-value correct-score" id="current-score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">خطأ</span>
                    <span class="stat-value error-score" id="wrong-score">0</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Question Card - Main Content -->
            <div class="exam-content">
                <!-- Question -->
                <div id="question-card" class="question-card">
                    <div class="question-text-wrapper">
                        <div class="question-text" id="question-text"></div>
                    </div>
                    
                    <!-- Options Grid -->
                    <div id="options-container" class="options-grid"></div>
                    
                    <!-- Feedback -->
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>

            <!-- Navigation Buttons - Bottom -->
            <div class="exam-navigation">
                <button id="prev-btn" class="nav-btn prev" style="display: none;">← السابق</button>
                <button id="next-btn" class="nav-btn next" style="display: none;">التالي →</button>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-container" class="results-container">
            <div class="results-card">
                <div class="results-grade" id="results-grade"></div>
                <div class="results-percentage" id="results-percentage">0%</div>
                <div class="results-score" id="results-score"></div>
                <div class="results-grade-text" id="results-grade-text"></div>
                <div class="results-time" id="results-time"></div>

                <div class="results-buttons">
                    <button id="review-btn" class="result-btn primary">
                        <i class="fas fa-redo"></i> مراجعة الأخطاء (<span id="wrong-count">0</span>)
                    </button>
                    <button id="restart-btn" class="result-btn secondary">
                        <i class="fas fa-sync"></i> إعادة الاختبار
                    </button>
                    <button id="back-to-books-btn" class="result-btn secondary">
                        <i class="fas fa-home"></i> العودة للكتب
                    </button>
                </div>
            </div>
        </section>

        <!-- Review Section -->
        <section id="review-container" class="review-container">
            <div id="review-content"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button id="back-review-btn" class="result-btn primary" onclick="app.restartExam()">
                    العودة للنتائج
                </button>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div id="footerContactDetails" class="footer-contact"></div>
            <div id="footerSocialButtons" class="footer-links"></div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 منصة الاختبارات القانونية V2 | جميع الحقوق محفوظة</p>
            <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.6;">تم تطويره بواسطة Manus AI</p>
        </div>
    </footer>
