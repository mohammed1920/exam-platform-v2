<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الامتحانات القانونية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --gold: #c29d5f;
            --gold-dim: #9a7a47;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        h1 {
            font-size: 28px;
            color: var(--gold);
            font-weight: 700;
        }
        .header-actions button {
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .header-actions button:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .sidebar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 16px;
        }
        .book-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .book-item:hover, .book-item.active {
            background: var(--border);
            border-color: var(--gold);
        }
        .content-area {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 10px 15px;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(194, 157, 95, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button.primary {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            flex: 1;
        }
        button.primary:hover {
            background: var(--gold-dim);
            transform: translateY(-2px);
        }
        button.secondary {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }
        button.secondary:hover {
            background: #475569;
        }
        button.danger {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button.danger:hover {
            background: #dc2626;
        }
        .question-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .question-item h4 {
            color: var(--gold);
            margin-bottom: 8px;
        }
        .question-item p {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 10px;
        }
        .option-item {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .option-item input {
            flex: 1;
            margin-right: 10px;
        }
        .option-item button {
            padding: 6px 12px;
            font-size: 12px;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--green);
            color: var(--green);
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--red);
            color: var(--red);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ لوحة التحكم - الامتحانات القانونية</h1>
            <div class="header-actions">
                <button onclick="syncWithGitHub()">🔄 مزامنة مع GitHub</button>
                <button onclick="goToMainSite()">👁️ عرض الموقع</button>
            </div>
        </header>

        <div id="alert-container"></div>

        <div class="main-grid">
            <!-- الشريط الجانبي -->
            <div class="sidebar">
                <h3>الكتب المتاحة</h3>
                <div id="books-list"></div>
                <button class="primary" style="margin-top: 15px; width: 100%;" onclick="showAddBookForm()">+ إضافة كتاب جديد</button>
            </div>

            <!-- منطقة المحتوى -->
            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('overview')">📊 نظرة عامة</button>
                    <button class="tab-btn" onclick="switchTab('chapters')">📖 الفصول</button>
                    <button class="tab-btn" onclick="switchTab('questions')">❓ الأسئلة</button>
                </div>

                <!-- تبويب النظرة العامة -->
                <div id="overview" class="tab-content active">
                    <h2 id="book-title" style="color: var(--gold); margin-bottom: 20px;">اختر كتاباً</h2>
                    <div id="book-stats" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="color: var(--text-dim); font-size: 12px; margin-bottom: 5px;">عدد الفصول</div>
                            <div id="stat-chapters" style="font-size: 24px; color: var(--gold); font-weight: 700;">0</div>
                        </div>
                        <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="color: var(--text-dim); font-size: 12px; margin-bottom: 5px;">عدد الأسئلة</div>
                            <div id="stat-questions" style="font-size: 24px; color: var(--gold); font-weight: 700;">0</div>
                        </div>
                        <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="color: var(--text-dim); font-size: 12px; margin-bottom: 5px;">آخر تحديث</div>
                            <div id="stat-updated" style="font-size: 14px; color: var(--text-dim);">-</div>
                        </div>
                    </div>
                </div>

                <!-- تبويب الفصول -->
                <div id="chapters" class="tab-content">
                    <h3 style="color: var(--gold); margin-bottom: 15px;">إدارة الفصول</h3>
                    <button class="primary" style="margin-bottom: 20px;" onclick="showAddChapterForm()">+ إضافة فصل جديد</button>
                    <div id="chapters-list"></div>
                </div>

                <!-- تبويب الأسئلة -->
                <div id="questions" class="tab-content">
                    <h3 style="color: var(--gold); margin-bottom: 15px;">إدارة الأسئلة</h3>
                    <div style="margin-bottom: 20px;">
                        <label>اختر الفصل:</label>
                        <select id="chapter-select" onchange="loadQuestionsForChapter()" style="margin-bottom: 15px;">
                            <option value="">-- اختر فصلاً --</option>
                        </select>
                        <button class="primary" onclick="showAddQuestionForm()">+ إضافة سؤال جديد</button>
                    </div>
                    <div id="questions-list"></div>
                </div>
            </div>
        </div>

        <!-- نماذج الإضافة والتعديل (مخفية افتراضياً) -->
        <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; padding: 20px;">
            <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; max-width: 600px; margin: 50px auto; padding: 30px; max-height: 80vh; overflow-y: auto;">
                <div id="modal-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let currentBook = null;
        let currentChapter = null;
        let booksData = [];

        // تحميل البيانات عند فتح الصفحة
        async function loadBooks() {
            try {
                const response = await fetch('./data/books.json');
                booksData = await response.json();
                renderBooksList();
            } catch (error) {
                showAlert('خطأ في تحميل الكتب: ' + error.message, 'error');
            }
        }

        function renderBooksList() {
            const list = document.getElementById('books-list');
            list.innerHTML = booksData.map(book => `
                <div class="book-item" onclick="selectBook('${book.id}')" id="book-${book.id}">
                    <strong>${book.title}</strong>
                    <div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">
                        ${book.chapters} فصول
                    </div>
                </div>
            `).join('');
        }

        function selectBook(bookId) {
            currentBook = booksData.find(b => b.id === bookId);
            document.querySelectorAll('.book-item').forEach(el => el.classList.remove('active'));
            document.getElementById('book-' + bookId).classList.add('active');
            updateBookInfo();
            loadChapters();
        }

        function updateBookInfo() {
            if (!currentBook) return;
            document.getElementById('book-title').textContent = currentBook.title;
            document.getElementById('stat-chapters').textContent = currentBook.chapters;
            calculateTotalQuestions();
        }

        async function calculateTotalQuestions() {
            if (!currentBook) return;
            let total = 0;
            for (let i = 1; i <= currentBook.chapters; i++) {
                try {
                    const response = await fetch(`./data/${currentBook.id}/chapter_${i}.json`);
                    if (response.ok) {
                        const chapter = await response.json();
                        total += (chapter.questions?.length || 0);
                    }
                } catch (e) {}
            }
            document.getElementById('stat-questions').textContent = total;
        }

        async function loadChapters() {
            if (!currentBook) return;
            try {
                const response = await fetch(`./data/${currentBook.id}/chapters.json`);
                const chapters = await response.json();
                renderChapters(chapters);
                updateChapterSelect(chapters);
            } catch (error) {
                document.getElementById('chapters-list').innerHTML = '<p style="color: var(--text-dim);">لا توجد فصول بعد</p>';
            }
        }

        function renderChapters(chapters) {
            const list = document.getElementById('chapters-list');
            list.innerHTML = chapters.map((ch, idx) => `
                <div class="question-item">
                    <h4>الفصل ${idx + 1}: ${ch.title}</h4>
                    <p>${ch.questions?.length || 0} أسئلة</p>
                    <div style="display: flex; gap: 10px;">
                        <button class="secondary" onclick="editChapter('${currentBook.id}', ${idx})">تعديل</button>
                        <button class="danger" onclick="deleteChapter('${currentBook.id}', ${idx})">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function updateChapterSelect(chapters) {
            const select = document.getElementById('chapter-select');
            select.innerHTML = '<option value="">-- اختر فصلاً --</option>' + 
                chapters.map((ch, idx) => `<option value="${idx}">الفصل ${idx + 1}: ${ch.title}</option>`).join('');
        }

        async function loadQuestionsForChapter() {
            const chapterIdx = document.getElementById('chapter-select').value;
            if (!chapterIdx && chapterIdx !== '0') return;
            
            try {
                const response = await fetch(`./data/${currentBook.id}/chapter_${parseInt(chapterIdx) + 1}.json`);
                const chapter = await response.json();
                renderQuestions(chapter.questions || [], chapterIdx);
            } catch (error) {
                document.getElementById('questions-list').innerHTML = '<p style="color: var(--text-dim);">لا توجد أسئلة</p>';
            }
        }

        function renderQuestions(questions, chapterIdx) {
            const list = document.getElementById('questions-list');
            list.innerHTML = questions.map((q, idx) => `
                <div class="question-item">
                    <h4>السؤال ${idx + 1}</h4>
                    <p>${q.q}</p>
                    <div style="margin-top: 10px; margin-bottom: 10px;">
                        ${q.options.map((opt, i) => `
                            <div style="padding: 8px; background: var(--bg); margin: 5px 0; border-radius: 4px; border-left: 3px solid ${i === q.correct ? 'var(--green)' : 'var(--border)'};">
                                ${String.fromCharCode(1575 + i)}) ${opt}
                            </div>
                        `).join('')}
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="secondary" onclick="editQuestion('${currentBook.id}', ${chapterIdx}, ${idx})">تعديل</button>
                        <button class="danger" onclick="deleteQuestion('${currentBook.id}', ${chapterIdx}, ${idx})">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showAddBookForm() {
            const modal = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 20px;">إضافة كتاب جديد</h2>
                <div class="form-group">
                    <label>اسم الكتاب (بالعربية)</label>
                    <input type="text" id="book-title-input" placeholder="مثال: القانون الدستوري">
                </div>
                <div class="form-group">
                    <label>معرف الكتاب (بالإنجليزية، بدون مسافات)</label>
                    <input type="text" id="book-id-input" placeholder="مثال: law_constitutional">
                </div>
                <div class="form-group">
                    <label>عدد الفصول المتوقع</label>
                    <input type="number" id="book-chapters-input" placeholder="0" min="0">
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="saveNewBook()">حفظ الكتاب</button>
                    <button class="secondary" onclick="closeModal()">إلغاء</button>
                </div>
            `;
        }

        function showAddChapterForm() {
            if (!currentBook) {
                showAlert('يجب اختيار كتاب أولاً', 'error');
                return;
            }
            const modal = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 20px;">إضافة فصل جديد</h2>
                <div class="form-group">
                    <label>اسم الفصل</label>
                    <input type="text" id="chapter-title-input" placeholder="مثال: الفصل الأول - مقدمة">
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="saveNewChapter()">حفظ الفصل</button>
                    <button class="secondary" onclick="closeModal()">إلغاء</button>
                </div>
            `;
        }

        function showAddQuestionForm() {
            const chapterIdx = document.getElementById('chapter-select').value;
            if (!chapterIdx && chapterIdx !== '0') {
                showAlert('يجب اختيار فصل أولاً', 'error');
                return;
            }
            const modal = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 20px;">إضافة سؤال جديد</h2>
                <div class="form-group">
                    <label>نص السؤال</label>
                    <textarea id="question-text-input" placeholder="أدخل نص السؤال..."></textarea>
                </div>
                <div class="form-group">
                    <label>الخيار الأول</label>
                    <input type="text" id="option-1-input" placeholder="أ) ...">
                </div>
                <div class="form-group">
                    <label>الخيار الثاني</label>
                    <input type="text" id="option-2-input" placeholder="ب) ...">
                </div>
                <div class="form-group">
                    <label>الخيار الثالث</label>
                    <input type="text" id="option-3-input" placeholder="ج) ...">
                </div>
                <div class="form-group">
                    <label>الخيار الرابع</label>
                    <input type="text" id="option-4-input" placeholder="د) ...">
                </div>
                <div class="form-group">
                    <label>الإجابة الصحيحة (0-3)</label>
                    <select id="correct-answer-input">
                        <option value="0">أ) الخيار الأول</option>
                        <option value="1">ب) الخيار الثاني</option>
                        <option value="2">ج) الخيار الثالث</option>
                        <option value="3">د) الخيار الرابع</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="saveNewQuestion()">حفظ السؤال</button>
                    <button class="secondary" onclick="closeModal()">إلغاء</button>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        async function saveNewBook() {
            const title = document.getElementById('book-title-input').value;
            const id = document.getElementById('book-id-input').value;
            const chapters = parseInt(document.getElementById('book-chapters-input').value) || 0;

            if (!title || !id) {
                showAlert('يجب ملء جميع الحقول', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/books/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, title, chapters })
                });
                const result = await response.json();
                if (response.ok) {
                    showAlert('تم إضافة الكتاب بنجاح', 'success');
                    closeModal();
                    loadBooks();
                } else {
                    showAlert('خطأ: ' + result.detail, 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function saveNewChapter() {
            const title = document.getElementById('chapter-title-input').value;
            if (!title) {
                showAlert('يجب إدخال اسم الفصل', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/chapters/add?book_id=${currentBook.id}&title=${encodeURIComponent(title)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (response.ok) {
                    showAlert('تم إضافة الفصل بنجاح', 'success');
                    closeModal();
                    loadChapters();
                } else {
                    showAlert('خطأ: ' + result.detail, 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function saveNewQuestion() {
            const text = document.getElementById('question-text-input').value;
            const options = [
                document.getElementById('option-1-input').value,
                document.getElementById('option-2-input').value,
                document.getElementById('option-3-input').value,
                document.getElementById('option-4-input').value
            ];
            const correct = parseInt(document.getElementById('correct-answer-input').value);
            const chapterIdx = parseInt(document.getElementById('chapter-select').value);

            if (!text || options.some(o => !o)) {
                showAlert('يجب ملء جميع الحقول', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/questions/add?book_id=${currentBook.id}&chapter_id=${chapterIdx}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        q: text, 
                        opts: options, 
                        ans: correct, 
                        explanation: '' 
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    showAlert('تم إضافة السؤال بنجاح', 'success');
                    closeModal();
                    loadQuestionsForChapter();
                } else {
                    showAlert('خطأ: ' + result.detail, 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function editChapter(bookId, chapterIdx) {
            const chapters = await fetch(`./data/${bookId}/chapters.json`).then(r => r.json());
            const chapter = chapters[chapterIdx];
            const modal = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 20px;">تعديل الفصل</h2>
                <div class="form-group">
                    <label>اسم الفصل</label>
                    <input type="text" id="edit-chapter-title" value="${chapter.title}">
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="updateChapter('${bookId}', ${chapterIdx})">حفظ التعديلات</button>
                    <button class="secondary" onclick="closeModal()">إلغاء</button>
                </div>
            `;
        }

        async function updateChapter(bookId, chapterIdx) {
            const title = document.getElementById('edit-chapter-title').value;
            try {
                const response = await fetch(`${API_BASE}/chapters/${bookId}/${chapterIdx}?title=${encodeURIComponent(title)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    showAlert('تم تحديث الفصل بنجاح', 'success');
                    closeModal();
                    loadChapters();
                } else {
                    showAlert('خطأ في التحديث', 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function deleteChapter(bookId, chapterIdx) {
            if (confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
                try {
                    const response = await fetch(`${API_BASE}/chapters/${bookId}/${chapterIdx}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        showAlert('تم حذف الفصل بنجاح', 'success');
                        loadChapters();
                    } else {
                        showAlert('خطأ في الحذف', 'error');
                    }
                } catch (error) {
                    showAlert('خطأ في الاتصال: ' + error.message, 'error');
                }
            }
        }

        async function editQuestion(bookId, chapterIdx, questionIdx) {
            const chapter = await fetch(`./data/${bookId}/chapter_${chapterIdx + 1}.json`).then(r => r.json());
            const question = chapter.questions[questionIdx];
            const modal = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 20px;">تعديل السؤال</h2>
                <div class="form-group">
                    <label>نص السؤال</label>
                    <textarea id="edit-question-text">${question.q}</textarea>
                </div>
                <div class="form-group">
                    <label>الخيار الأول</label>
                    <input type="text" id="edit-option-1" value="${question.options[0]}">
                </div>
                <div class="form-group">
                    <label>الخيار الثاني</label>
                    <input type="text" id="edit-option-2" value="${question.options[1]}">
                </div>
                <div class="form-group">
                    <label>الخيار الثالث</label>
                    <input type="text" id="edit-option-3" value="${question.options[2]}">
                </div>
                <div class="form-group">
                    <label>الخيار الرابع</label>
                    <input type="text" id="edit-option-4" value="${question.options[3]}">
                </div>
                <div class="form-group">
                    <label>الإجابة الصحيحة</label>
                    <select id="edit-correct-answer">
                        <option value="0" ${question.correct === 0 ? 'selected' : ''}>أ) الخيار الأول</option>
                        <option value="1" ${question.correct === 1 ? 'selected' : ''}>ب) الخيار الثاني</option>
                        <option value="2" ${question.correct === 2 ? 'selected' : ''}>ج) الخيار الثالث</option>
                        <option value="3" ${question.correct === 3 ? 'selected' : ''}>د) الخيار الرابع</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="updateQuestion('${bookId}', ${chapterIdx}, ${questionIdx})">حفظ التعديلات</button>
                    <button class="secondary" onclick="closeModal()">إلغاء</button>
                </div>
            `;
        }

        async function updateQuestion(bookId, chapterIdx, questionIdx) {
            const text = document.getElementById('edit-question-text').value;
            const options = [
                document.getElementById('edit-option-1').value,
                document.getElementById('edit-option-2').value,
                document.getElementById('edit-option-3').value,
                document.getElementById('edit-option-4').value
            ];
            const correct = parseInt(document.getElementById('edit-correct-answer').value);

            try {
                const response = await fetch(`${API_BASE}/questions/${bookId}/${chapterIdx}/${questionIdx}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        q: text, 
                        opts: options, 
                        ans: correct, 
                        explanation: '' 
                    })
                });
                if (response.ok) {
                    showAlert('تم تحديث السؤال بنجاح', 'success');
                    closeModal();
                    loadQuestionsForChapter();
                } else {
                    showAlert('خطأ في التحديث', 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function deleteQuestion(bookId, chapterIdx, questionIdx) {
            if (confirm('هل أنت متأكد من حذف هذا السؤال؟')) {
                try {
                    const response = await fetch(`${API_BASE}/questions/${bookId}/${chapterIdx}/${questionIdx}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        showAlert('تم حذف السؤال بنجاح', 'success');
                        loadQuestionsForChapter();
                    } else {
                        showAlert('خطأ في الحذف', 'error');
                    }
                } catch (error) {
                    showAlert('خطأ في الاتصال: ' + error.message, 'error');
                }
            }
        }

        async function syncWithGitHub() {
            showAlert('جاري المزامنة مع GitHub...', 'success');
            // سيتم تطويره لاحقاً
        }

        function goToMainSite() {
            window.location.href = './index.html';
        }

        // تحميل البيانات عند فتح الصفحة
        loadBooks();
    </script>
</body>
</html>
