<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الامتحانات القانونية</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --gold: #c29d5f;
            --gold-dim: #9a7a47;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }
        body {
            font-family: "Cairo", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
        h1 { font-size: 24px; color: var(--gold); }
        .main-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .sidebar { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .book-item { background: var(--bg); padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .book-item.active { border-color: var(--gold); background: var(--border); }
        .content-area { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px 20px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Cairo'; }
        .btn-primary { background: var(--gold); color: var(--bg); width: 100%; margin-top: 10px; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--gold); font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Cairo'; }
        .item-card { background: var(--bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 8px; z-index: 2000; font-weight: 700; }
        .alert-success { background: var(--green); color: white; }
        .alert-error { background: var(--red); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ لوحة التحكم</h1>
            <div>
                <button class="btn btn-secondary" onclick="openSettings()">⚙️ الإعدادات</button>
                <button class="btn btn-green" onclick="window.location.href='index.html'">👁️ عرض الموقع</button>
            </div>
        </header>

        <div class="main-grid">
            <div class="sidebar">
                <h3 style="margin-bottom: 15px;">الكتب</h3>
                <div id="books-list"></div>
                <button class="btn btn-primary" onclick="showModal('addBook')">+ إضافة كتاب</button>
            </div>

            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('overview')">نظرة عامة</button>
                    <button class="tab-btn" onclick="switchTab('chapters')">الفصول</button>
                    <button class="tab-btn" onclick="switchTab('questions')">الأسئلة</button>
                </div>

                <div id="overview" class="tab-content active">
                    <h2 id="current-book-name">اختر كتاباً من القائمة</h2>
                    <p id="current-book-info" style="color: var(--text-dim); margin-top: 10px;"></p>
                </div>

                <div id="chapters" class="tab-content">
                    <button class="btn btn-green" style="margin-bottom: 20px;" onclick="showModal('addChapter')">+ إضافة فصل جديد</button>
                    <div id="chapters-list"></div>
                </div>

                <div id="questions" class="tab-content">
                    <div class="form-group">
                        <label>اختر الفصل:</label>
                        <select id="chapter-select" onchange="loadQuestions()"></select>
                    </div>
                    <button class="btn btn-green" style="margin-bottom: 20px;" onclick="showModal('addQuestion')">+ إضافة سؤال جديد</button>
                    <div id="questions-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script>
        let books = [];
        let currentBook = null;
        let currentChapters = [];
        let config = {
            token: localStorage.getItem('gh_token'),
            user: localStorage.getItem('gh_user') || 'mohammed1920',
            repo: localStorage.getItem('gh_repo') || 'exam-platform-v2'
        };

        function decode(b64) {
            return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
        }
        function encode(str) {
            return btoa(Array.from(new TextEncoder().encode(str), b => String.fromCharCode(b)).join(''));
        }

        async function ghRequest(path, method = 'GET', body = null) {
            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
            const headers = { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        async function loadBooks() {
            try {
                const data = await ghRequest('data/books.json');
                books = JSON.parse(decode(data.content));
                renderBooks();
            } catch (e) { alert('خطأ في تحميل الكتب: ' + e.message); }
        }

        function renderBooks() {
            const list = document.getElementById('books-list');
            list.innerHTML = books.map(b => `
                <div class="book-item ${currentBook?.id === b.id ? 'active' : ''}" onclick="selectBook('${b.id}')">
                    <strong>${b.title}</strong>
                    <div style="font-size: 12px; color: var(--text-dim);">${b.chapters} فصول</div>
                </div>
            `).join('');
        }

        async function selectBook(id) {
            currentBook = books.find(b => b.id === id);
            document.getElementById('current-book-name').textContent = currentBook.title;
            document.getElementById('current-book-info').textContent = `المؤلف: ${currentBook.author || 'غير معروف'}`;
            renderBooks();
            await loadChapters();
            switchTab('overview');
        }

        async function loadChapters() {
            try {
                const data = await ghRequest(`data/${currentBook.id}/chapters.json`);
                currentChapters = JSON.parse(decode(data.content));
                renderChapters();
                updateChapterSelect();
            } catch (e) { currentChapters = []; renderChapters(); }
        }

        function renderChapters() {
            const list = document.getElementById('chapters-list');
            list.innerHTML = currentChapters.map((c, i) => `
                <div class="item-card">
                    <strong>${c.title}</strong>
                    <p style="font-size: 12px; color: var(--text-dim);">${c.questions?.length || 0} سؤال</p>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="btn btn-secondary" style="padding: 5px 15px;" onclick="editChapter(${i})">تعديل</button>
                        <button class="btn btn-red" style="padding: 5px 15px;" onclick="deleteChapter(${i})">حذف</button>
                    </div>
                </div>
            `).join('') || 'لا توجد فصول';
        }

        function updateChapterSelect() {
            const sel = document.getElementById('chapter-select');
            sel.innerHTML = currentChapters.map((c, i) => `<option value="${i}">${c.title}</option>`).join('');
            loadQuestions();
        }

        function loadQuestions() {
            const idx = document.getElementById('chapter-select').value;
            const list = document.getElementById('questions-list');
            if (idx === "" || !currentChapters[idx]) { list.innerHTML = 'اختر فصلاً'; return; }
            const qs = currentChapters[idx].questions || [];
            list.innerHTML = qs.map((q, i) => `
                <div class="item-card">
                    <p><strong>س ${i+1}:</strong> ${q.q}</p>
                    <div style="font-size: 13px; margin: 10px 0;">
                        ${q.opts.map((o, oi) => `<div style="${oi === q.ans ? 'color: var(--green); font-weight: 700;' : ''}">${oi+1}) ${o}</div>`).join('')}
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" style="padding: 5px 15px;" onclick="editQuestion(${idx}, ${i})">تعديل</button>
                        <button class="btn btn-red" style="padding: 5px 15px;" onclick="deleteQuestion(${idx}, ${i})">حذف</button>
                    </div>
                </div>
            `).join('') || 'لا توجد أسئلة';
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        function showModal(type, data = null) {
            const body = document.getElementById('modal-body');
            let html = '';
            if (type === 'addBook') {
                html = `<h2>إضافة كتاب</h2>
                    <div class="form-group"><label>اسم الكتاب</label><input id="m-title"></div>
                    <div class="form-group"><label>المعرف (English)</label><input id="m-id"></div>
                    <div class="form-group"><label>المؤلف</label><input id="m-author"></div>
                    <button class="btn btn-primary" onclick="saveBook()">حفظ</button>`;
            } else if (type === 'addChapter') {
                html = `<h2>إضافة فصل</h2>
                    <div class="form-group"><label>اسم الفصل</label><input id="m-title"></div>
                    <button class="btn btn-primary" onclick="saveChapter()">حفظ</button>`;
            } else if (type === 'addQuestion') {
                html = `<h2>إضافة سؤال</h2>
                    <div class="form-group"><label>السؤال</label><textarea id="m-q"></textarea></div>
                    <div class="form-group"><label>خيار 1</label><input id="m-o1"></div>
                    <div class="form-group"><label>خيار 2</label><input id="m-o2"></div>
                    <div class="form-group"><label>خيار 3</label><input id="m-o3"></div>
                    <div class="form-group"><label>خيار 4</label><input id="m-o4"></div>
                    <div class="form-group"><label>الإجابة الصحيحة (1-4)</label><input type="number" id="m-ans" min="1" max="4"></div>
                    <button class="btn btn-primary" onclick="saveQuestion()">حفظ</button>`;
            }
            body.innerHTML = html + `<button class="btn btn-secondary" style="margin-top:10px" onclick="closeModal()">إلغاء</button>`;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        async function saveBook() {
            const b = { id: document.getElementById('m-id').value, title: document.getElementById('m-title').value, author: document.getElementById('m-author').value, chapters: 0 };
            books.push(b);
            await ghRequest('data/books.json', 'PUT', { message: 'إضافة كتاب', content: encode(JSON.stringify(books, null, 2)), sha: (await ghRequest('data/books.json')).sha });
            closeModal(); loadBooks();
        }

        async function saveChapter() {
            const title = document.getElementById('m-title').value;
            currentChapters.push({ id: `${currentBook.id}_ch${currentChapters.length+1}`, title, questions: [] });
            const sha = (await ghRequest(`data/${currentBook.id}/chapters.json`).catch(() => ({sha:null}))).sha;
            await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'إضافة فصل', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
            currentBook.chapters = currentChapters.length;
            await ghRequest('data/books.json', 'PUT', { message: 'تحديث فصول', content: encode(JSON.stringify(books, null, 2)), sha: (await ghRequest('data/books.json')).sha });
            closeModal(); loadChapters();
        }

        async function saveQuestion() {
            const idx = document.getElementById('chapter-select').value;
            const q = { q: document.getElementById('m-q').value, opts: [document.getElementById('m-o1').value, document.getElementById('m-o2').value, document.getElementById('m-o3').value, document.getElementById('m-o4').value], ans: parseInt(document.getElementById('m-ans').value)-1 };
            currentChapters[idx].questions.push(q);
            const sha = (await ghRequest(`data/${currentBook.id}/chapters.json`)).sha;
            await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'إضافة سؤال', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
            closeModal(); loadQuestions();
        }

        function openSettings() {
            const t = prompt('أدخل GitHub Token:', config.token || '');
            if (t) { localStorage.setItem('gh_token', t); config.token = t; loadBooks(); }
        }

        if (config.token) loadBooks(); else openSettings();
    </script>
</body>
</html>
