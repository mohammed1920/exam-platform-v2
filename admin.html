<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الامتحانات القانونية</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --gold: #c29d5f;
            --gold-dim: #9a7a47;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }
        body {
            font-family: "Cairo", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        h1 {
            font-size: 28px;
            color: var(--gold);
            font-weight: 700;
        }
        .header-actions button {
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .header-actions button:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .sidebar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 16px;
        }
        .book-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .book-item:hover, .book-item.active {
            background: var(--border);
            border-color: var(--gold);
        }
        .content-area {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 10px 15px;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: "Cairo", sans-serif;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(194, 157, 95, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button.primary {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            flex: 1;
        }
        button.primary:hover {
            background: var(--gold-dim);
            transform: translateY(-2px);
        }
        button.secondary {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }
        button.secondary:hover {
            background: #475569;
        }
        button.danger {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .question-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .question-item h4 {
            color: var(--gold);
            margin-bottom: 8px;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .alert.success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--green); color: var(--green); }
        .alert.error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--red); color: var(--red); }
        .alert.info { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #3b82f6; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ لوحة التحكم - الامتحانات القانونية</h1>
            <div class="header-actions">
                <button onclick="goToMainSite()">👁️ عرض الموقع</button>
                <button onclick="openSettings()">⚙️ الإعدادات</button>
            </div>
        </header>

        <div id="alert-container"></div>

        <div id="settings-modal" class="modal-overlay">
            <div class="modal-content">
                <h2 style="color: var(--gold); margin-bottom: 20px;">⚙️ إعدادات الوصول</h2>
                <div class="form-group">
                    <label>GitHub Token</label>
                    <input type="password" id="github-token" placeholder="ghp_xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>GitHub Username</label>
                    <input type="text" id="github-username" placeholder="mohammed1920">
                </div>
                <div class="form-group">
                    <label>Repository Name</label>
                    <input type="text" id="github-repo" placeholder="exam-platform-v2">
                </div>
                <div class="btn-group">
                    <button class="primary" onclick="saveSettings()">💾 حفظ</button>
                    <button class="secondary" onclick="closeSettings()">إلغاء</button>
                </div>
            </div>
        </div>

        <div id="modal-overlay" class="modal-overlay">
            <div class="modal-content" id="modal-content"></div>
        </div>

        <div class="main-grid">
            <div class="sidebar">
                <h3>الكتب المتاحة</h3>
                <div id="books-list"></div>
                <button class="primary" style="margin-top: 15px; width: 100%;" onclick="showAddBookForm()">+ إضافة كتاب جديد</button>
            </div>

            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('overview')">📊 نظرة عامة</button>
                    <button class="tab-btn" onclick="switchTab('chapters')">📖 الفصول</button>
                    <button class="tab-btn" onclick="switchTab('questions')">❓ الأسئلة</button>
                </div>

                <div id="overview" class="tab-content active">
                    <h2 id="book-title" style="color: var(--gold); margin-bottom: 20px;">اختر كتاباً</h2>
                    <div id="book-stats" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                        <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="color: var(--text-dim); font-size: 12px;">عدد الفصول</div>
                            <div id="stat-chapters" style="font-size: 24px; color: var(--gold); font-weight: 700;">0</div>
                        </div>
                        <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="color: var(--text-dim); font-size: 12px;">حالة الاتصال</div>
                            <div id="stat-status" style="font-size: 14px; color: var(--text-dim);">غير متصل</div>
                        </div>
                    </div>
                </div>

                <div id="chapters" class="tab-content">
                    <h3 style="color: var(--gold); margin-bottom: 15px;">إدارة الفصول</h3>
                    <button class="primary" style="margin-bottom: 20px;" onclick="showAddChapterForm()">+ إضافة فصل جديد</button>
                    <div id="chapters-list"></div>
                </div>

                <div id="questions" class="tab-content">
                    <h3 style="color: var(--gold); margin-bottom: 15px;">إدارة الأسئلة</h3>
                    <div style="margin-bottom: 20px;">
                        <label>اختر الفصل:</label>
                        <select id="chapter-select" onchange="loadQuestionsForChapter()"></select>
                        <button class="primary" style="margin-top: 10px;" onclick="showAddQuestionForm()">+ إضافة سؤال جديد</button>
                    </div>
                    <div id="questions-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentBook = null;
        let booksData = [];
        let githubConfig = {
            token: localStorage.getItem('github_token') || '',
            username: localStorage.getItem('github_username') || 'mohammed1920',
            repo: localStorage.getItem('github_repo') || 'exam-platform-v2'
        };

        // دالة فك التشفير للتعامل مع اللغة العربية بشكل صحيح
        function decodeUTF8(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        // دالة التشفير للتعامل مع اللغة العربية بشكل صحيح
        function encodeUTF8(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        async function initAdmin() {
            if (!githubConfig.token) { openSettings(); return; }
            updateConnectionStatus();
            loadBooks();
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
            document.getElementById('github-token').value = githubConfig.token;
            document.getElementById('github-username').value = githubConfig.username;
            document.getElementById('github-repo').value = githubConfig.repo;
        }

        function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

        function saveSettings() {
            githubConfig = {
                token: document.getElementById('github-token').value.trim(),
                username: document.getElementById('github-username').value.trim(),
                repo: document.getElementById('github-repo').value.trim()
            };
            localStorage.setItem('github_token', githubConfig.token);
            localStorage.setItem('github_username', githubConfig.username);
            localStorage.setItem('github_repo', githubConfig.repo);
            closeSettings();
            initAdmin();
        }

        function updateConnectionStatus() {
            const el = document.getElementById('stat-status');
            el.textContent = githubConfig.token ? '✅ متصل' : '❌ غير متصل';
            el.style.color = githubConfig.token ? 'var(--green)' : 'var(--red)';
        }

        async function loadBooks() {
            try {
                const res = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/data/books.json`, {
                    headers: { 'Authorization': `token ${githubConfig.token}` }
                });
                if (!res.ok) throw new Error('فشل التحميل');
                const data = await res.json();
                booksData = JSON.parse(decodeUTF8(data.content));
                renderBooksList();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        function renderBooksList() {
            const list = document.getElementById('books-list');
            list.innerHTML = booksData.map(book => `
                <div class="book-item ${currentBook?.id === book.id ? 'active' : ''}" onclick="selectBook('${book.id}')">
                    <strong>${book.title}</strong>
                    <div style="font-size: 12px; color: var(--text-dim);">${book.chapters} فصول</div>
                </div>
            `).join('');
        }

        function selectBook(bookId) {
            currentBook = booksData.find(b => b.id === bookId);
            renderBooksList();
            document.getElementById('book-title').textContent = currentBook.title;
            document.getElementById('stat-chapters').textContent = currentBook.chapters;
            loadChapters();
        }

        async function loadChapters() {
            if (!currentBook) return;
            try {
                const res = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/data/${currentBook.id}/chapters.json`, {
                    headers: { 'Authorization': `token ${githubConfig.token}` }
                });
                if (!res.ok) throw new Error('لا توجد فصول');
                const data = await res.json();
                const chapters = JSON.parse(decodeUTF8(data.content));
                renderChapters(chapters);
                updateChapterSelect(chapters);
            } catch (e) { document.getElementById('chapters-list').innerHTML = '<p>لا توجد فصول</p>'; }
        }

        function renderChapters(chapters) {
            document.getElementById('chapters-list').innerHTML = chapters.map((ch, idx) => `
                <div class="question-item">
                    <h4>${ch.title}</h4>
                    <p>${ch.questions?.length || 0} أسئلة</p>
                    <button class="secondary" onclick="editChapter(${idx})">تعديل</button>
                    <button class="danger" onclick="deleteChapter(${idx})">حذف</button>
                </div>
            `).join('');
        }

        function updateChapterSelect(chapters) {
            const select = document.getElementById('chapter-select');
            select.innerHTML = '<option value="">-- اختر فصلاً --</option>' + 
                chapters.map((ch, idx) => `<option value="${idx}">${ch.title}</option>`).join('');
        }

        async function loadQuestionsForChapter() {
            const idx = document.getElementById('chapter-select').value;
            if (idx === "") return;
            try {
                const res = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/data/${currentBook.id}/chapters.json`, {
                    headers: { 'Authorization': `token ${githubConfig.token}` }
                });
                const data = await res.json();
                const chapters = JSON.parse(decodeUTF8(data.content));
                const questions = chapters[idx].questions || [];
                document.getElementById('questions-list').innerHTML = questions.map((q, qIdx) => `
                    <div class="question-item">
                        <p><strong>س ${qIdx+1}:</strong> ${q.q}</p>
                        <div style="font-size: 13px; margin: 10px 0;">
                            ${q.opts.map((o, i) => `<div style="${i === q.ans ? 'color: var(--green); font-weight: 700;' : ''}">${i+1}) ${o}</div>`).join('')}
                        </div>
                        <button class="secondary" onclick="editQuestion(${idx}, ${qIdx})">تعديل</button>
                        <button class="danger" onclick="deleteQuestion(${idx}, ${qIdx})">حذف</button>
                    </div>
                `).join('');
            } catch (e) { showAlert(e.message, 'error'); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(msg, type) {
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = msg;
            document.getElementById('alert-container').appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        async function updateFileOnGitHub(path, content, msg) {
            const res = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${githubConfig.token}` }
            });
            let sha = null;
            if (res.ok) { const data = await res.json(); sha = data.sha; }
            const putRes = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubConfig.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, content: encodeUTF8(content), sha: sha })
            });
            if (!putRes.ok) throw new Error('فشل الحفظ على GitHub');
            showAlert('تم الحفظ بنجاح', 'success');
        }

        function goToMainSite() { window.location.href = './index.html'; }
        initAdmin();
    </script>
</body>
</html>
