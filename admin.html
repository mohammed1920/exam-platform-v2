<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الامتحانات القانونية</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --gold: #c29d5f;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }
        body { font-family: "Cairo", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 20px; color: var(--gold); }
        .main-grid { display: grid; grid-template-columns: 280px 1fr; gap: 15px; }
        .sidebar { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); height: fit-content; max-height: 80vh; overflow-y: auto; }
        .book-item { background: var(--bg); padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .book-item.active { border-color: var(--gold); background: var(--border); }
        .book-item:hover { border-color: var(--gold); }
        .content-area { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
        .tab-btn { background: none; border: none; color: var(--text-dim); padding: 8px 15px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; font-family: 'Cairo'; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; max-height: 70vh; overflow-y: auto; }
        .tab-content.active { display: block; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Cairo'; font-size: 14px; }
        .btn-primary { background: var(--gold); color: var(--bg); width: 100%; margin-top: 10px; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: var(--gold); font-size: 13px; }
        input, textarea, select { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Cairo'; font-size: 14px; }
        .item-card { background: var(--bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); }
        .item-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .item-card-title { font-weight: 700; color: var(--gold); }
        .item-card-actions { display: flex; gap: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .alert { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; z-index: 2000; font-weight: 700; font-size: 14px; display: none; }
        .alert.active { display: block; }
        .alert-success { background: var(--green); color: white; }
        .alert-error { background: var(--red); color: white; }
        .question-text { font-size: 13px; line-height: 1.4; margin: 8px 0; }
        .question-options { font-size: 12px; margin: 8px 0; }
        .question-option { padding: 4px 0; }
        .question-option.correct { color: var(--green); font-weight: 700; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ لوحة التحكم V2</h1>
            <div>
                <button class="btn btn-secondary" onclick="openSettings()">⚙️ الإعدادات</button>
                <button class="btn btn-green" onclick="window.location.href='index.html'">👁️ عرض الموقع</button>
            </div>
        </header>

        <div id="alert-box" class="alert"></div>

        <div class="main-grid">
            <div class="sidebar">
                <h3 style="margin-bottom: 10px; font-size: 16px;">الكتب</h3>
                <div id="books-list">جاري التحميل...</div>
                <button class="btn btn-primary" onclick="showModal('addBook')">+ إضافة كتاب</button>
            </div>

            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('overview')">نظرة عامة</button>
                    <button class="tab-btn" onclick="switchTab('chapters')">الفصول</button>
                    <button class="tab-btn" onclick="switchTab('questions')">الأسئلة</button>
                </div>

                <div id="overview" class="tab-content active">
                    <h2 id="current-book-name">اختر كتاباً للبدء</h2>
                    <div id="current-book-info" style="margin-top: 15px;"></div>
                </div>

                <div id="chapters" class="tab-content">
                    <button class="btn btn-green" style="margin-bottom: 15px;" onclick="showModal('addChapter')">+ إضافة فصل جديد</button>
                    <div id="chapters-list"></div>
                </div>

                <div id="questions" class="tab-content">
                    <div class="form-group">
                        <label>اختر الفصل:</label>
                        <select id="chapter-select" onchange="renderQuestions()"></select>
                    </div>
                    <button class="btn btn-green" style="margin-bottom: 15px;" onclick="showModal('addQuestion')">+ إضافة سؤال جديد</button>
                    <div id="questions-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal"><div class="modal-content" id="modal-body"></div></div>

    <script>
        let books = [];
        let currentBook = null;
        let currentChapters = [];
        let editingChapterIdx = null;
        let editingQuestionIdx = null;
        let config = {
            token: localStorage.getItem('gh_token'),
            user: localStorage.getItem('gh_user') || 'mohammed1920',
            repo: localStorage.getItem('gh_repo') || 'exam-platform-v2'
        };

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = `alert active alert-${type}`;
            setTimeout(() => box.className = 'alert', 3000);
        }

        function decode(b64) {
            return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
        }
        function encode(str) {
            return btoa(Array.from(new TextEncoder().encode(str), b => String.fromCharCode(b)).join(''));
        }

        async function ghRequest(path, method = 'GET', body = null) {
            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}?t=${Date.now()}`;
            const headers = { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message);
            }
            return res.json();
        }

        async function loadBooks() {
            if (!config.token) return;
            try {
                const data = await ghRequest('data/books.json');
                books = JSON.parse(decode(data.content));
                renderBooks();
            } catch (e) { showAlert('خطأ في الاتصال: ' + e.message, 'error'); }
        }

        function renderBooks() {
            const list = document.getElementById('books-list');
            list.innerHTML = books.map(b => `
                <div class="book-item ${currentBook?.id === b.id ? 'active' : ''}" onclick="selectBook('${b.id}')">
                    <strong>${b.title}</strong>
                    <div style="font-size: 11px; color: var(--text-dim);">${b.chapters || 0} فصول</div>
                </div>
            `).join('');
        }

        async function selectBook(id) {
            currentBook = books.find(b => b.id === id);
            document.getElementById('current-book-name').textContent = currentBook.title;
            document.getElementById('current-book-info').innerHTML = `
                <p><strong>المؤلف:</strong> ${currentBook.author || 'غير محدد'}</p>
                <p><strong>الوصف:</strong> ${currentBook.description || 'بدون وصف'}</p>
                <p><strong>عدد الفصول:</strong> ${currentBook.chapters || 0}</p>
            `;
            renderBooks();
            await loadChapters();
            switchTab('overview');
        }

        async function loadChapters() {
            if (!currentBook) return;
            try {
                const data = await ghRequest(`data/${currentBook.id}/chapters.json`);
                currentChapters = JSON.parse(decode(data.content));
                renderChapters();
                updateChapterSelect();
            } catch (e) {
                currentChapters = [];
                renderChapters();
                updateChapterSelect();
            }
        }

        function renderChapters() {
            const list = document.getElementById('chapters-list');
            if (currentChapters.length === 0) {
                list.innerHTML = '<p style="color:var(--text-dim)">لا توجد فصول مضافة بعد.</p>';
                return;
            }
            list.innerHTML = currentChapters.map((c, i) => `
                <div class="item-card">
                    <div class="item-card-header">
                        <div class="item-card-title">${c.title}</div>
                        <div class="item-card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="editChapter(${i})">تعديل</button>
                            <button class="btn btn-red btn-sm" onclick="deleteChapter(${i})">حذف</button>
                        </div>
                    </div>
                    <div style="font-size: 12px; color: var(--text-dim);">${(c.questions || []).length} أسئلة</div>
                </div>
            `).join('');
        }

        function updateChapterSelect() {
            const sel = document.getElementById('chapter-select');
            sel.innerHTML = currentChapters.map((c, i) => `<option value="${i}">${c.title}</option>`).join('');
            if (currentChapters.length > 0) renderQuestions();
        }

        function renderQuestions() {
            const idx = document.getElementById('chapter-select').value;
            const list = document.getElementById('questions-list');
            if (idx === "" || !currentChapters[idx]) { list.innerHTML = 'اختر فصلاً لعرض الأسئلة'; return; }
            const qs = currentChapters[idx].questions || [];
            if (qs.length === 0) {
                list.innerHTML = '<p style="color:var(--text-dim)">لا توجد أسئلة في هذا الفصل.</p>';
                return;
            }
            list.innerHTML = qs.map((q, i) => {
                const qText = q.q || q.question || '';
                const opts = q.opts || q.options || [];
                const ans = q.ans !== undefined ? q.ans : q.correct;
                return `
                    <div class="item-card">
                        <div class="item-card-header">
                            <div class="item-card-title">س ${i+1}</div>
                            <div class="item-card-actions">
                                <button class="btn btn-secondary btn-sm" onclick="editQuestion(${idx}, ${i})">تعديل</button>
                                <button class="btn btn-red btn-sm" onclick="deleteQuestion(${idx}, ${i})">حذف</button>
                            </div>
                        </div>
                        <div class="question-text">${qText}</div>
                        <div class="question-options">
                            ${opts.map((o, oi) => `
                                <div class="question-option ${oi === ans ? 'correct' : ''}">
                                    ${oi+1}) ${o}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (event) event.target.classList.add('active');
        }

        function openSettings() {
            const t = prompt('أدخل GitHub Token:', config.token || '');
            if (t) {
                localStorage.setItem('gh_token', t);
                config.token = t;
                loadBooks();
            }
        }

        function showModal(type) {
            editingChapterIdx = null;
            editingQuestionIdx = null;
            const body = document.getElementById('modal-body');
            let html = '';
            if (type === 'addBook') {
                html = `<h3>إضافة كتاب جديد</h3>
                    <div class="form-group"><label>اسم الكتاب (عربي)</label><input id="m-title" placeholder="مثال: القانون المدني"></div>
                    <div class="form-group"><label>المعرف (English - بدون مسافات)</label><input id="m-id" placeholder="مثال: law_civil"></div>
                    <div class="form-group"><label>المؤلف</label><input id="m-author" placeholder="مثال: د. أحمد محمد"></div>
                    <div class="form-group"><label>الوصف</label><textarea id="m-desc" placeholder="وصف الكتاب"></textarea></div>
                    <button class="btn btn-primary" onclick="saveBook()">إضافة الكتاب</button>`;
            } else if (type === 'addChapter') {
                html = `<h3>إضافة فصل جديد</h3>
                    <div class="form-group"><label>اسم الفصل</label><input id="m-title" placeholder="مثال: الفصل الأول"></div>
                    <button class="btn btn-primary" onclick="saveChapter()">إضافة الفصل</button>`;
            } else if (type === 'editChapter') {
                const ch = currentChapters[editingChapterIdx];
                html = `<h3>تعديل الفصل</h3>
                    <div class="form-group"><label>اسم الفصل</label><input id="m-title" value="${ch.title}"></div>
                    <button class="btn btn-primary" onclick="saveChapter()">حفظ التعديلات</button>`;
            } else if (type === 'addQuestion') {
                html = `<h3>إضافة سؤال جديد</h3>
                    <div class="form-group"><label>نص السؤال</label><textarea id="m-q"></textarea></div>
                    <div class="form-group"><label>خيار 1</label><input id="m-o1"></div>
                    <div class="form-group"><label>خيار 2</label><input id="m-o2"></div>
                    <div class="form-group"><label>خيار 3</label><input id="m-o3"></div>
                    <div class="form-group"><label>خيار 4</label><input id="m-o4"></div>
                    <div class="form-group"><label>رقم الإجابة الصحيحة (1-4)</label><input type="number" id="m-ans" min="1" max="4"></div>
                    <button class="btn btn-primary" onclick="saveQuestion()">إضافة السؤال</button>`;
            } else if (type === 'editQuestion') {
                const chIdx = document.getElementById('chapter-select').value;
                const q = currentChapters[chIdx].questions[editingQuestionIdx];
                const qText = q.q || q.question || '';
                const opts = q.opts || q.options || [];
                const ans = (q.ans !== undefined ? q.ans : q.correct) + 1;
                html = `<h3>تعديل السؤال</h3>
                    <div class="form-group"><label>نص السؤال</label><textarea id="m-q">${qText}</textarea></div>
                    <div class="form-group"><label>خيار 1</label><input id="m-o1" value="${opts[0] || ''}"></div>
                    <div class="form-group"><label>خيار 2</label><input id="m-o2" value="${opts[1] || ''}"></div>
                    <div class="form-group"><label>خيار 3</label><input id="m-o3" value="${opts[2] || ''}"></div>
                    <div class="form-group"><label>خيار 4</label><input id="m-o4" value="${opts[3] || ''}"></div>
                    <div class="form-group"><label>رقم الإجابة الصحيحة (1-4)</label><input type="number" id="m-ans" min="1" max="4" value="${ans}"></div>
                    <button class="btn btn-primary" onclick="saveQuestion()">حفظ التعديلات</button>`;
            }
            body.innerHTML = html + `<button class="btn btn-secondary" style="margin-top:10px; width:100%" onclick="closeModal()">إلغاء</button>`;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        async function saveBook() {
            const id = document.getElementById('m-id').value.trim();
            const title = document.getElementById('m-title').value.trim();
            const author = document.getElementById('m-author').value.trim();
            const desc = document.getElementById('m-desc').value.trim();
            if (!id || !title) return;
            books.push({ id, title, author, description: desc, chapters: 0 });
            try {
                const sha = (await ghRequest('data/books.json')).sha;
                await ghRequest('data/books.json', 'PUT', { message: 'إضافة كتاب', content: encode(JSON.stringify(books, null, 2)), sha });
                showAlert('تمت إضافة الكتاب بنجاح');
                closeModal(); loadBooks();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        async function saveChapter() {
            const title = document.getElementById('m-title').value.trim();
            if (!title || !currentBook) return;
            try {
                if (editingChapterIdx !== null) {
                    currentChapters[editingChapterIdx].title = title;
                } else {
                    currentChapters.push({ title, questions: [] });
                }
                let sha = null;
                try { sha = (await ghRequest(`data/${currentBook.id}/chapters.json`)).sha; } catch(e){}
                await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'تحديث الفصول', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
                currentBook.chapters = currentChapters.length;
                const bSha = (await ghRequest('data/books.json')).sha;
                await ghRequest('data/books.json', 'PUT', { message: 'تحديث عدد الفصول', content: encode(JSON.stringify(books, null, 2)), sha: bSha });
                showAlert(editingChapterIdx !== null ? 'تم تعديل الفصل بنجاح' : 'تمت إضافة الفصل بنجاح');
                closeModal(); loadChapters();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        async function saveQuestion() {
            const chIdx = document.getElementById('chapter-select').value;
            const q = document.getElementById('m-q').value.trim();
            const opts = [document.getElementById('m-o1').value, document.getElementById('m-o2').value, document.getElementById('m-o3').value, document.getElementById('m-o4').value];
            const ans = parseInt(document.getElementById('m-ans').value) - 1;
            if (!q || isNaN(ans)) return;
            try {
                if (editingQuestionIdx !== null) {
                    currentChapters[chIdx].questions[editingQuestionIdx] = { q, opts, ans };
                } else {
                    currentChapters[chIdx].questions.push({ q, opts, ans });
                }
                const sha = (await ghRequest(`data/${currentBook.id}/chapters.json`)).sha;
                await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'تحديث الأسئلة', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
                showAlert(editingQuestionIdx !== null ? 'تم تعديل السؤال بنجاح' : 'تمت إضافة السؤال بنجاح');
                closeModal(); renderQuestions();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        function editChapter(idx) {
            editingChapterIdx = idx;
            showModal('editChapter');
        }

        async function deleteChapter(idx) {
            if (!confirm('هل أنت متأكد من حذف هذا الفصل؟')) return;
            try {
                currentChapters.splice(idx, 1);
                let sha = null;
                try { sha = (await ghRequest(`data/${currentBook.id}/chapters.json`)).sha; } catch(e){}
                await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'حذف فصل', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
                currentBook.chapters = currentChapters.length;
                const bSha = (await ghRequest('data/books.json')).sha;
                await ghRequest('data/books.json', 'PUT', { message: 'تحديث عدد الفصول', content: encode(JSON.stringify(books, null, 2)), sha: bSha });
                showAlert('تم حذف الفصل بنجاح');
                loadChapters();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        function editQuestion(chIdx, qIdx) {
            editingQuestionIdx = qIdx;
            document.getElementById('chapter-select').value = chIdx;
            showModal('editQuestion');
        }

        async function deleteQuestion(chIdx, qIdx) {
            if (!confirm('هل أنت متأكد من حذف هذا السؤال؟')) return;
            try {
                currentChapters[chIdx].questions.splice(qIdx, 1);
                const sha = (await ghRequest(`data/${currentBook.id}/chapters.json`)).sha;
                await ghRequest(`data/${currentBook.id}/chapters.json`, 'PUT', { message: 'حذف سؤال', content: encode(JSON.stringify(currentChapters, null, 2)), sha });
                showAlert('تم حذف السؤال بنجاح');
                renderQuestions();
            } catch (e) { showAlert(e.message, 'error'); }
        }

        window.onload = () => { if (config.token) loadBooks(); else openSettings(); };
    </script>
</body>
</html>
